<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova AI Video Studio</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<header class="navbar">

<div class="logo">
🎬 Nova AI
</div>

<nav>

<a href="#">Home</a>

<a href="#">Templates</a>

<a href="#">Pricing</a>

<a href="#">Blog</a>

<a href="#">Login</a>

</nav>

</header>

<section class="hero">

<div class="hero-left">

<h1>
Create Viral AI Videos
in One Click
</h1>
<div class="language-switch">
    <button class="active">🇮🇳 Hindi</button>
    <button>🇺🇸 English</button>
</div>
<p>

Generate AI Script, AI Images,
Voice and HD Video instantly.

</p>

<div class="prompt-box">

<textarea id="prompt"
placeholder="Describe your video idea..."></textarea>
<div class="quick-tags">
    <span>🔥 Facts</span>
    <span>👻 Horror</span>
    <span>🧠 Motivation</span>
    <span>📖 Story</span>
</div>
<button onclick="generateVideo()">

✨ Generate AI Video

</button>

</div>

</div>

<div class="hero-right">

<div class="glass-card">

<h3>🔥 Trending</h3>

<ul>

<li>Facts Video</li>

<li>Horror Story</li>

<li>Motivation</li>

<li>Mythology</li>

<li>Kids Story</li>

</ul>

</div>

</div>

</section>

<div id="result"></div>

<script src="script.js"></script>

</body>
</html>
